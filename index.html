<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora Hello Kitty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="Style.css">
  </head>
  <body>

    <div class="container" style="max-width: 400px;">
      
  <!-- Visor -->
  <div class="row mb-2">
    <div class="col-12">
      <input type="text" id="visor" class="form-control text-end" value="0" readonly>
    </div>
  </div>

  <!-- Linha de botões -->
  <div class="row g-2 mb-2">
  
    <div class="col-3"><button class="btn btn-danger w-100" onclick="apagarTudo()">AC</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="apagarUltimo()">⌫</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="escolherOperador('%')">%</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="escolherOperador('÷')">÷</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('7')">7</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('8')">8</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('9')">9</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="escolherOperador('x')">x</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('4')">4</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('5')">5</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('6')">6</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="escolherOperador('-')">-</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('1')">1</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('2')">2</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('3')">3</button></div>
    <div class="col-3"><button class="btn btn-danger w-100" onclick="escolherOperador('+')">+</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('0')">0</button></div>
    <div class="col-3"><button class="btn btn-light w-100" onclick="digitarNumero('.')">.</button></div>
    <div class="col-6"><button class="btn btn-danger w-100" onclick="calcular()">=</button></div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="Calculadora.js"></script>
  </body>
</html>
